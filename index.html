<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Natural Disaster Awareness</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>



body{
margin:0;
font-family:'Poppins', sans-serif;


background:
radial-gradient(circle at 20% 30%, rgba(60,80,120,0.25), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(40,60,90,0.25), transparent 40%),
linear-gradient(180deg, #0b0e13, #0f141b);

color:#eaeaea;
min-height:100vh;
}

/* ===== HEADER ===== */

header{
text-align:center;
padding:90px 20px 60px 20px;
}

header h1{
font-size:50px;
font-weight:600;
margin-bottom:12px;
letter-spacing:1px;
}

header p{
font-size:18px;
opacity:0.6;
}

/* ===== CONTAINER ===== */

.container{
padding:20px 20px 80px 20px;
}

/* ===== GRID (2x2 centered) ===== */

.grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:35px;
max-width:750px;
margin:auto;
}

/* ===== CARD ===== */

.card{
position:relative;
height:260px;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:white;
background:#1a1d24;
transition:0.4s ease;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

/* ===== IMAGE ===== */

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
opacity:0.85;
}

/* ===== OVERLAY ===== */

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:flex-end;
padding:25px;
background:linear-gradient(transparent, rgba(0,0,0,0.9));
opacity:0;
transition:0.4s ease;
}

/* ===== TITLE ===== */

.title{
font-size:24px;
font-weight:500;
margin-bottom:8px;
}

/* ===== EXPLORE TEXT ===== */

.btn{
font-size:14px;
opacity:0.7;
transition:0.3s;
}

/* ===== HOVER ===== */

.card:hover{
transform:translateY(-6px);
box-shadow:0 18px 45px rgba(0,0,0,0.6);
}

.card:hover img{
transform:scale(1.08);
opacity:1;
}

.card:hover .overlay{
opacity:1;
}

.card:hover .btn{
opacity:1;
}

/* ===== FOOTER ===== */

footer{
text-align:center;
padding:40px 20px;
font-size:14px;
opacity:0.4;
}

@media (max-width:700px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>
<body>

<header>
<h1>Natural Disaster Awareness</h1>
<p>Understanding risks. Learning from real events. Staying prepared.</p>
</header>

<div class="container">
<div class="grid">

<a href="earthquake.html" class="card">
<img src="resimler/marrakesh-city-after-earthquake_23-2150811913.avif">
<div class="overlay">
<div class="title">Earthquake</div>
<div class="btn">Explore →</div>
</div>
</a>

<a href="flood.html" class="card">
<img src="resimler/sel.jpg">
<div class="overlay">
<div class="title">Flood</div>
<div class="btn">Explore →</div>
</div>
</a>

<a href="hurricane.html" class="card">
<img src="resimler/hurricane.jpg">
<div class="overlay">
<div class="title">Hurricane</div>
<div class="btn">Explore →</div>
</div>
</a>

<a href="wildfire.html" class="card">
<img src="resimler/wildfire1.jpg">
<div class="overlay">
<div class="title">Wildfire</div>
<div class="btn">Explore →</div>
</div>
</a>

</div>
</div>

<footer>
Natural Disaster Awareness Project
</footer>

</body>
</html>
